name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra labs
      - run: uv run pytest -q
      - run: uv run ruff check src tests labs
      - run: uv run ruff format --check src tests labs
      - run: uv run --extra labs python labs/framework_lab.py
