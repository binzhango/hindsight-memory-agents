name: lmstudio-memory-demo
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    ports:
      - "127.0.0.1:8889:8888"
      - "127.0.0.1:9998:9999"
    environment:
      HINDSIGHT_API_WORKER_ID: lmstudio-memory-demo
      HINDSIGHT_API_LLM_PROVIDER: lmstudio
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:1234/v1
      HINDSIGHT_API_LLM_MODEL: ${LM_STUDIO_MODEL:-muse-glimmer-30b}
      HINDSIGHT_API_LLM_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      HINDSIGHT_API_LLM_STRICT_SCHEMA_RETAIN: "true"
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "8192"
      HINDSIGHT_API_RETAIN_CHUNK_SIZE: "2000"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "false"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
    shm_size: 512mb
    volumes:
      - memory-data:/home/hindsight/.pg0
volumes:
  memory-data:
