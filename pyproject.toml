[project]
name = "hindsight-memory-agents"
version = "0.1.0"
description = "Shared Hindsight memory for LangChain agents using LM Studio"
requires-python = ">=3.11"
dependencies = ["langchain-openai>=1.0,<2", "hindsight-client>=1.2,<2", "aiohttp>=3.10", "python-dotenv>=1.0", "pydantic>=2.10"]

[project.optional-dependencies]
jev = ["langchain-typesafe==0.0.1"]
labs = ["hindsight-langgraph[langgraph]", "hindsight-pydantic-ai"]

[project.scripts]
memory-agents = "memory_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agents"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.uv.sources]
hindsight-client = { git = "https://github.com/vectorize-io/hindsight.git", rev = "ee3bd049ebe3b96b7d1120328429102100c1e28e", subdirectory = "hindsight-clients/python" }
hindsight-langgraph = { git = "https://github.com/vectorize-io/hindsight.git", rev = "ee3bd049ebe3b96b7d1120328429102100c1e28e", subdirectory = "hindsight-integrations/langgraph" }
hindsight-pydantic-ai = { git = "https://github.com/vectorize-io/hindsight.git", rev = "ee3bd049ebe3b96b7d1120328429102100c1e28e", subdirectory = "hindsight-integrations/pydantic-ai" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
